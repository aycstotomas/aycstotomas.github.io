            <!--
                HOW TO ADD YOUR PHOTOS
                1. Save each picture as a .webp in the project root (same folder as this file).
                2. Inside a card, delete the <div class="fr-placeholder"> block and uncomment the <img> line above it.
                Suggested file names: family-mom.webp, family-dad.webp, family-siblings.webp, friends.webp
            -->
            <div class="fr-stage">
                <!-- constellation threads that connect the four hanging stars -->
                <svg class="fr-threads" viewBox="0 0 1000 34" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                    <path d="M125 0 L375 34 L625 0 L875 34" vector-effect="non-scaling-stroke"/>
                </svg>

                <!-- MOM -->
                <figure class="fr-card" style="--rot:-1.8deg; --dy:0; --i:0">
                    <span class="fr-pin" aria-hidden="true"></span>
                    <svg class="fr-deco tl" aria-hidden="true" focusable="false" viewBox="0 0 48 48" style="--w:80; --h:80; --ox:-26; --oy:-14; --r:-14deg; --d:0s"><use href="#fr-flower"/></svg>
