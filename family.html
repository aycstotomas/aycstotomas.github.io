    <script>
        (function () {
            var cards = document.querySelectorAll('.fr-card');
            var still = window.matchMedia('(prefers-reduced-motion: reduce)');
            var narrow = window.matchMedia('(max-width: 768px)');
            function set(c, on) { c.classList.toggle('is-open', on); c.setAttribute('aria-expanded', on); }

            // play the disc video only while its case is open
            cards.forEach(function (c) {
                var v = c.querySelector('video');
                if (!v) return;
                function sync() {
                    if (c.classList.contains('is-open') && !still.matches) { var r = v.play(); if (r && r.catch) r.catch(function () {}); }
                    else v.pause();
                }
                new MutationObserver(sync).observe(c, { attributes: true, attributeFilter: ['class'] });
            });

            // the cases appear closed once the star-lines reach them (laptop / desktop), then open one after another like books
            cards.forEach(function (c, i) {
                setTimeout(function () { set(c, true); }, still.matches ? 0 : (narrow.matches ? 1000 + i * 260 : 2750 + i * 200));
                // click / Enter closes or re-opens a case
                c.addEventListener('click', function () { set(c, !c.classList.contains('is-open')); });
                c.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); set(c, !c.classList.contains('is-open')); }
                });
            });
        })();
    </script>
