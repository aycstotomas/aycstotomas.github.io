    <script>
        (function () {
            var cards = document.querySelectorAll('.fr-card');
            var canHover = window.matchMedia('(hover: hover)');
            function set(c, on) { c.classList.toggle('is-open', on); c.setAttribute('aria-expanded', on); }
            var still = window.matchMedia('(prefers-reduced-motion: reduce)');
            cards.forEach(function (c) {
                var v = c.querySelector('video');
                if (!v) return;
                function sync() {
                    var open = c.classList.contains('is-open') || (canHover.matches && c.matches(':hover'));
                    if (open && !still.matches) { var r = v.play(); if (r && r.catch) r.catch(function () {}); }
                    else v.pause();
                }
                c.addEventListener('mouseenter', sync);
                c.addEventListener('mouseleave', sync);
                new MutationObserver(sync).observe(c, { attributes: true, attributeFilter: ['class'] });
            });
            cards.forEach(function (c) {
                c.addEventListener('click', function () { if (!canHover.matches) set(c, !c.classList.contains('is-open')); });
                c.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); set(c, !c.classList.contains('is-open')); }
                });
            });
        })();
    </script>
